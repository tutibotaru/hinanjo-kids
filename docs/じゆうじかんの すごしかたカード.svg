<?xml version="1.0" encoding="UTF-8"?>
<!-- 避難所の自由時間の過ごし方ヒント 親子向けカード(A4縦)。親子ミニ手順カードと同テイスト。カテゴリ別の色分けboxで「あそびメニュー」風。ブラウザで開いてA4印刷。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 840 1188" role="img" aria-label="ひなんじょでの じかんの すごしかた カード">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <rect width="840" height="1188" fill="#FAF5FF"/>

  <!-- 帯 -->
  <rect x="0" y="0" width="840" height="172" fill="url(#hdr)"/>
  <text x="750" y="78" text-anchor="middle" font-family="sans-serif" font-size="46">🎈</text>
  <text x="44" y="72" font-family="sans-serif" font-size="38" font-weight="bold" fill="#FFFFFF">ひなんじょでの すごしかた</text>
  <text x="46" y="114" font-family="sans-serif" font-size="22" fill="#EDE9FE">じゆうじかんを たのしく！ものが なくても あそべるよ</text>
  <text x="46" y="146" font-family="sans-serif" font-size="17" fill="#DDD6FE">ねている人・こまっている人も いるよ。しずかに たのしもう</text>

  <!-- ことばの あそび -->
  <rect x="44" y="192" width="366" height="198" rx="16" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="2"/>
  <text x="66" y="226" font-family="sans-serif" font-size="21" font-weight="bold" fill="#5B21B6">💬 ことばの あそび</text>
  <text x="66" y="262" font-family="sans-serif" font-size="17" fill="#5B21B6">・しりとり</text>
  <text x="66" y="294" font-family="sans-serif" font-size="17" fill="#5B21B6">・なぞなぞ・クイズの だしっこ</text>
  <text x="66" y="326" font-family="sans-serif" font-size="17" fill="#5B21B6">・れんそう（赤い もの なーんだ？）</text>
  <text x="66" y="358" font-family="sans-serif" font-size="17" fill="#5B21B6">・あたまもじ（「あ」から いくつ？）</text>

  <!-- てを つかう あそび -->
  <rect x="430" y="192" width="366" height="198" rx="16" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
  <text x="452" y="226" font-family="sans-serif" font-size="21" font-weight="bold" fill="#1E40AF">✋ てを つかう あそび</text>
  <text x="452" y="262" font-family="sans-serif" font-size="17" fill="#1E40AF">・じゃんけん大会</text>
  <text x="452" y="294" font-family="sans-serif" font-size="17" fill="#1E40AF">・あやとり（ひもが あれば）</text>
  <text x="452" y="326" font-family="sans-serif" font-size="17" fill="#1E40AF">・手あそび歌（むすんでひらいて）</text>
  <text x="452" y="358" font-family="sans-serif" font-size="17" fill="#1E40AF">・かげ絵（ライトと 手で かべに）</text>

  <!-- かみと えんぴつ -->
  <rect x="44" y="402" width="366" height="198" rx="16" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="2"/>
  <text x="66" y="436" font-family="sans-serif" font-size="21" font-weight="bold" fill="#9D174D">🎨 かみと えんぴつ</text>
  <text x="66" y="472" font-family="sans-serif" font-size="17" fill="#9D174D">・お絵かき・ぬりえ</text>
  <text x="66" y="504" font-family="sans-serif" font-size="17" fill="#9D174D">・まちがいさがしを 作って だしあう</text>
  <text x="66" y="536" font-family="sans-serif" font-size="17" fill="#9D174D">・手作り ビンゴ</text>
  <text x="66" y="568" font-family="sans-serif" font-size="17" fill="#9D174D">・日記や てがみを かく</text>

  <!-- からだを ちょっと -->
  <rect x="430" y="402" width="366" height="198" rx="16" fill="#DCFCE7" stroke="#86EFAC" stroke-width="2"/>
  <text x="452" y="436" font-family="sans-serif" font-size="21" font-weight="bold" fill="#166534">🤸 からだを ちょっと</text>
  <text x="452" y="472" font-family="sans-serif" font-size="17" fill="#166534">・ストレッチ・ラジオたいそう</text>
  <text x="452" y="504" font-family="sans-serif" font-size="17" fill="#166534">・だるまさんが ころんだ（走らず）</text>
  <text x="452" y="536" font-family="sans-serif" font-size="17" fill="#166534">・まねっこ（ポーズを まねる）</text>
  <text x="452" y="568" font-family="sans-serif" font-size="17" fill="#166534">・その場で うごくと あったまる</text>

  <!-- みんなで -->
  <rect x="44" y="612" width="752" height="148" rx="16" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2"/>
  <text x="66" y="646" font-family="sans-serif" font-size="21" font-weight="bold" fill="#92400E">🎵 みんなで（年れい いろいろ）</text>
  <text x="66" y="684" font-family="sans-serif" font-size="17" fill="#92400E">・むかしの あそびを 教えあう</text>
  <text x="66" y="716" font-family="sans-serif" font-size="17" fill="#92400E">・本の よみきかせ</text>
  <text x="430" y="684" font-family="sans-serif" font-size="17" fill="#92400E">・うたを みんなで（小さめに）</text>
  <text x="430" y="716" font-family="sans-serif" font-size="17" fill="#92400E">・おてつだいも りっぱな すごしかた</text>

  <!-- たいせつな やくそく -->
  <rect x="44" y="772" width="752" height="140" rx="16" fill="#F3E8FF" stroke="#A78BFA" stroke-width="2"/>
  <text x="66" y="806" font-family="sans-serif" font-size="21" font-weight="bold" fill="#5B21B6">⚠ たいせつな やくそく</text>
  <text x="66" y="840" font-family="sans-serif" font-size="17" fill="#5B21B6">・走りまわらない・大きな声を ださない（ねてる人・こまってる人が いる）</text>
  <text x="66" y="870" font-family="sans-serif" font-size="17" fill="#5B21B6">・とおりみちで あそばない</text>
  <text x="66" y="900" font-family="sans-serif" font-size="17" fill="#5B21B6">・そとは 大人と いっしょ。こわい・つかれたら むりせず やすむ</text>

  <!-- おぼえてね -->
  <rect x="44" y="924" width="752" height="74" rx="16" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="2"/>
  <text x="420" y="968" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#6D28D9">💡 ものが なくても あたまと からだで あそべる！しずかに たのしもう</text>

  <!-- footer -->
  <text x="420" y="1040" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#6B7280">高梁青年会議所 ぼうさいキャンプ ／ 親子で避難所体験</text>
</svg>
